[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rdl-e2e-multimodal"
version = "0.1.0"
description = "End-to-end multimodal Relational Deep Learning: jointly fine-tuned text encoders + heterogeneous GNN, instead of frozen encoders."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "torch_geometric>=2.5",
    "transformers>=4.40",
    "torchmetrics>=1.0",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
relbench = ["relbench>=2.0", "pytorch_frame"]
dev = ["pytest>=7.0"]
viz = ["matplotlib", "networkx", "torchviz"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["rdl_e2e*"]
